// ═══ HOOKS & COMPONENTS ═══
function useReveal(){
  const ref=useRef(null);
  useEffect(()=>{
    const el=ref.current;if(!el)return;
    const obs=new IntersectionObserver(([e])=>{if(e.isIntersecting){el.classList.add('visible');obs.unobserve(el);}},{threshold:.12});
    obs.observe(el);return()=>obs.disconnect();
  },[]);
  return ref;
}
function R({children,d=0,style={}}){const ref=useReveal();return <div ref={ref} className={`reveal ${d?`reveal-d${d}`:''}`} style={style}>{children}</div>;}

function Tag({text,color=C.gold}){return <span style={{fontSize:10,fontWeight:700,letterSpacing:".14em",textTransform:"uppercase",color}}>{text}</span>;}
function Src({t}){return <span style={{fontSize:10,color:C.textDim,fontStyle:"italic",display:"block",marginTop:6}}>Source: {t}</span>;}
function Mark({children,color=C.gold}){return <span style={{background:`${color}1F`,color:C.text,padding:"1px 5px",borderRadius:3,fontWeight:700,boxDecorationBreak:"clone",WebkitBoxDecorationBreak:"clone"}}>{children}</span>;}
